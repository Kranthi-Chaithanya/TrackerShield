name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the app
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            # Permanent key from the repository secrets: every version can update the last one.
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE="$RUNNER_TEMP/release.jks"
            ./gradlew :app:assembleRelease :testapp:assembleDebug --no-daemon
            cp app/build/outputs/apk/release/app-release.apk TrackerShield.apk
            echo "signed with the permanent release key" > signing.txt
          else
            echo "No signing key in the repository secrets: building a test-signed APK"
            ./gradlew :app:assembleDebug :testapp:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk TrackerShield.apk
            echo "signed with a temporary test key (no permanent key set up)" > signing.txt
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs TrackerShield.apk | grep -i "SHA-256" >> signing.txt || true
          cat signing.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackerShield-apk
          path: |
            TrackerShield.apk
            signing.txt

      - name: Upload the test app used by the emulator test
        uses: actions/upload-artifact@v4
        with:
          name: tracker-demo-apk
          path: testapp/build/outputs/apk/debug/testapp-debug.apk

  emulator-test:
    # Installs the app on an Android 14 emulator and checks that it really blocks trackers.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TrackerShield-apk

      - uses: actions/download-artifact@v4
        with:
          name: tracker-demo-apk

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-test.sh TrackerShield.apk testapp-debug.apk

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            emulator-results/
            emulator-test-log.txt

      - name: Save the APK and test results to the build-output branch
        if: always()
        run: |
          mkdir -p out
          cp TrackerShield.apk signing.txt out/
          cp -r emulator-results out/ 2>/dev/null || true
          cp emulator-test-log.txt out/ 2>/dev/null || true
          echo "commit ${GITHUB_SHA::7} - emulator test: ${{ steps.emulator.outcome }}" > out/STATUS.txt
          cd out
          git init -q -b build-output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output

  release:
    # Publishes the APK only if it passed the emulator test.
    needs: emulator-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TrackerShield-apk

      - name: Publish the APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create latest TrackerShield.apk -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "TrackerShield - latest build" \
            --notes "Download **TrackerShield.apk** on your Android phone (Android 8.0 or newer), open it and tap Install. Then open TrackerShield and tap **Turn protection on**. Built from ${GITHUB_SHA::7} and tested on an Android 14 emulator."
