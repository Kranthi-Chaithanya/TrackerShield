plugins {
    id 'com.android.application'
}

// The release key (signing/, encrypted) is unlocked only by the SIGNING_PASSWORD repository
// secret during the GitHub build (see .github/workflows/build-apk.yml). Signing every version with the same
// key lets each new APK install over the old one and keep your history.
def signingKeystore = System.getenv('SIGNING_KEYSTORE')

android {
    namespace 'com.trackershield.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.trackershield.app'
        minSdk 26          // Android 8.0 and newer
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    if (signingKeystore) {
        signingConfigs {
            release {
                storeFile file(signingKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No libraries needed: the app uses only what is built into Android.
