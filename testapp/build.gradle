// "Tracker Demo": a tiny app used only by the automated emulator test. It has tracker
// class names built in and looks up tracker servers, like a real app with trackers would.
// It is not part of TrackerShield and is never released.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.trackershield.demo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.trackershield.demo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
